services:
  openvscode-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.openvscode
    ports:
      - "${VSCODE_PORT:-3003}:3003"
    environment:
      - CONNECTION_TOKEN=${VSCODE_TOKEN:-test}
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/workspace
    command: >
      node out/server-main.js
      --port 3003
      --host 0.0.0.0
      --connection-token ${VSCODE_TOKEN:-test}
      --accept-server-license-terms
    restart: unless-stopped
    dns:
      - 127.0.0.11
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003', (r) => process.exit(r.statusCode === 403 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  go-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - VSCODE_URL=http://openvscode-server:3003
      - VSCODE_TOKEN=${VSCODE_TOKEN:-test}
      - SERVER_TOKEN=${SERVER_TOKEN:-test}
      - CLAUDE_HOME=/root/.claude
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      - claude-home:/root/.claude
    depends_on:
      openvscode-server:
        condition: service_healthy
    dns:
      - 127.0.0.11
    command: >
      ./server_bin
      -vscode-url http://openvscode-server:3003
      -vscode-token ${VSCODE_TOKEN:-test}
      -token ${SERVER_TOKEN:-test}
      -port 8080
      -work-dir /workspace
    restart: unless-stopped

volumes:
  claude-home:
