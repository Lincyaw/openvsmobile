# Unified release workflow for openvsmobile.
#
# Tag naming convention:
#   v<semver>   e.g. v0.2.0, v0.2.0-rc1
#
# One tag, one GitHub Release, both halves of the product shipped together:
#   - Backend linux + macOS tarballs (x64 + arm64 where available),
#     native runners per platform/arch.
#   - Android APK (arm64-v8a), single host build. Iroh's Android FFI is
#     currently bundled for arm64 only; do not publish unsupported ABI splits.
#
# The APK's `kBackendVersion` is substituted from the tag right before
# `flutter build`, so a released APK always points at the matching backend
# release. Local debug builds use whatever the source file says.
#
# Pre-release detection looks for `-rc`, `-beta`, or `-alpha` in the tag and
# flips `prerelease=true`.
#
# Why native runners for backend (no qemu cross-compile):
#   node-pty's node-gyp rebuild needs the target arch's real toolchain.
#   GitHub-hosted arm64 runners (`ubuntu-24.04-arm`) became GA in 2025;
#   if they're ever unavailable we'll revisit, but don't preemptively
#   add qemu — the rebuild path is too fragile under emulation.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default everything to read; the release job opts into `contents: write`.
permissions:
  contents: read

# Never cancel an in-flight release — half-published GitHub Releases are
# worse than waiting for the previous run to finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    name: build backend (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: darwin
            arch: arm64
            runner: macos-26
          - platform: darwin
            arch: x64
            runner: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: next/backend/pnpm-lock.yaml

      - name: Install dependencies (incl. devDeps for typecheck)
        working-directory: next/backend
        run: pnpm install --frozen-lockfile

      - name: Typecheck (fail fast before producing a tarball)
        working-directory: next/backend
        run: pnpm typecheck

      - name: Pin backend package.json version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: next/backend
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Backend reports its version via package.json's "version" field
          # (see src/version.ts) which lands in runtime.json. install.sh's
          # post-start check refuses to proceed when the file version
          # disagrees with the installer's expected version, so this must
          # happen before building the backend tarball.
          sed -i "s/^  \"version\": \".*\",$/  \"version\": \"${tag}\",/" package.json
          grep "\"version\": \"${tag}\"" package.json

      - name: Build tarball for ${{ matrix.platform }}-${{ matrix.arch }}
        working-directory: next/backend
        env:
          OPENVSMOBILE_TARGET_PLATFORM: ${{ matrix.platform }}
        run: pkg/build-tarball.sh ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            next/backend/dist-pkg/openvsmobile-backend-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            next/backend/dist-pkg/openvsmobile-backend-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: build android
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the version dev/release have been validating against.
          # Bump deliberately, not by drift: pubspec.lock currently resolves
          # shared_preferences_android to a build that requires Flutter 3.44+.
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: next/app
        run: flutter pub get

      - name: Verify Android Iroh FFI payload
        working-directory: next/app
        run: |
          set -euo pipefail
          lib=android/app/src/main/jniLibs/arm64-v8a/libiroh_ffi.so
          test -f "$lib"
          desc="$(file -b "$lib")"
          echo "$desc"
          if ! grep -qi 'aarch64' <<<"$desc"; then
            echo "::error::Expected Android arm64 Iroh FFI library at $lib, got: $desc"
            exit 1
          fi

      - name: Analyze (fail fast before building APKs)
        working-directory: next/app
        run: flutter analyze

      - name: Pin kBackendVersion to tag
        working-directory: next/app
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"  # v0.2.0 → 0.2.0
          sed -i "s/^const String kBackendVersion = '.*';/const String kBackendVersion = '${tag}';/" lib/version.dart
          # Grep-confirm the substitution so a build never silently ships
          # the wrong version.
          grep "kBackendVersion = '${tag}'" lib/version.dart

      - name: Compute Android build metadata
        id: android-meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          core="${tag%%-*}"
          IFS=. read -r major minor patch extra <<< "$core"
          if [[ -z "${major:-}" || -z "${minor:-}" || -z "${patch:-}" || -n "${extra:-}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not v<major>.<minor>.<patch>[-suffix]"
            exit 1
          fi
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' contains a non-numeric semver core"
            exit 1
          fi
          base=$((10#$major * 1000000 + 10#$minor * 10000 + 10#$patch * 100))
          if [[ "$tag" == "$core" ]]; then
            offset=99
          elif [[ "$tag" =~ ([0-9]+)$ ]]; then
            offset="${BASH_REMATCH[1]}"
            if (( offset < 1 || offset > 98 )); then
              echo "::error::Pre-release numeric suffix must be 1..98 for Android versionCode"
              exit 1
            fi
          else
            offset=1
          fi
          build_number=$((base + offset))
          echo "build_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "Android versionName=${tag} versionCode=${build_number}"

      - name: Configure release signing (if secrets present)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" \
             && -n "${ANDROID_KEYSTORE_PASSWORD:-}" \
             && -n "${ANDROID_KEY_ALIAS:-}" \
             && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "Release signing secrets present — decoding keystore."
            keystore_path="${RUNNER_TEMP}/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
            # Gradle reads next/app/android/key.properties at configure time.
            # Heredoc body is at column 0 so no YAML indent leaks into the file.
          cat > next/app/android/key.properties <<EOF
          storeFile=${keystore_path}
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release signing secrets — building debug-signed APK; install will require uninstalling prior debug-signed install. See docs/release.md."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build arm64 release APK
        working-directory: next/app
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm64
          --build-name '${{ steps.android-meta.outputs.build_name }}'
          --build-number '${{ steps.android-meta.outputs.build_number }}'

      - name: Stage APKs and sha256 sidecars
        id: stage
        run: |
          set -euo pipefail
          src=next/app/build/app/outputs/flutter-apk
          out="${RUNNER_TEMP}/release-assets"
          mkdir -p "$out"
          tag="${GITHUB_REF_NAME:-vlocal}"
          # Flutter emits this filename verbatim with --split-per-abi and
          # --target-platform android-arm64; rename to include the tag for
          # unambiguous downloads.
          # Output filenames look like `openvsmobile-app-v0.2.0-arm64-v8a.apk`:
          # the literal `app-` keeps the APK assets visually distinct from the
          # backend tarballs that share the same Release page.
          declare -A map=(
            ["app-arm64-v8a-release.apk"]="openvsmobile-app-${tag}-arm64-v8a.apk"
          )
          for src_name in "${!map[@]}"; do
            dst_name="${map[$src_name]}"
            if [[ -f "${src}/${src_name}" ]]; then
              cp "${src}/${src_name}" "${out}/${dst_name}"
              ( cd "$out" && sha256sum "$dst_name" > "${dst_name}.sha256" )
            else
              echo "::error::Expected APK not found: ${src}/${src_name}"
              exit 1
            fi
          done
          ls -la "$out"
          echo "dir=${out}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-android
          path: |
            ${{ steps.stage.outputs.dir }}/*.apk
            ${{ steps.stage.outputs.dir }}/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-backend, build-android]
    runs-on: ubuntu-latest
    # Only publish a release on actual tag pushes; workflow_dispatch runs
    # the build matrix as a smoke test but stops short of releasing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout (for install.sh)
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage install.sh alongside tarballs
        run: cp next/backend/pkg/install.sh artifacts/install.sh

      - name: List staged release assets
        run: ls -la artifacts/

      - name: Compose release body from sha256 files
        id: body
        env:
          # Signing mode flows through job outputs (no artifact round-trip).
          SIGNING_MODE: ${{ needs.build-android.outputs.signing }}
          # Absolute repo URL for the release-body docs link so it resolves
          # the same from the Release page, RSS, and mobile clients.
          DOCS_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/release.md
        run: |
          set -euo pipefail
          # Build two sha256 lookup helpers so backend and android sections
          # can be composed independently from the merged artifacts/ dir.
          backend_row() {
            local fname="$1"
            local sha_file="artifacts/${fname}.sha256"
            if [[ -f "$sha_file" ]]; then
              local sum
              sum="$(awk '{print $1}' "$sha_file")"
              echo "| \`${fname}\` | \`${sum}\` |"
            fi
          }
          {
            echo 'body<<RELEASE_BODY_EOF'
            echo "## openvsmobile ${GITHUB_REF_NAME}"
            echo
            echo '### Backend'
            echo
            echo '| File | SHA-256 |'
            echo '| --- | --- |'
            for fname in artifacts/openvsmobile-backend-*.tar.gz; do
              [ -f "$fname" ] || continue
              base="$(basename "$fname")"
              backend_row "$base"
            done
            echo "| \`install.sh\` | (no checksum) |"
            echo
            echo '### Android'
            echo
            echo '| File | SHA-256 |'
            echo '| --- | --- |'
            for fname in artifacts/openvsmobile-app-*.apk; do
              [ -f "$fname" ] || continue
              base="$(basename "$fname")"
              sum="$(awk '{print $1}' "artifacts/${base}.sha256")"
              echo "| \`${base}\` | \`${sum}\` |"
            done
            echo
            echo "Android release APKs currently target \`arm64-v8a\` because the bundled Iroh FFI library is arm64-only."
            echo
            echo '### Install'
            echo
            version="${GITHUB_REF_NAME#v}"
            echo 'Direct install:'
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash -s -- ${version}"
            echo '```'
            echo
            echo "SSH-bootstrap from the app's Settings screen → SSH bootstrap. Iroh is enabled by default."
            echo "The attached \`install.sh\` asset is still published for pinned, release-local installs."
            if [[ "${SIGNING_MODE}" != "release" ]]; then
              echo
              echo "> ⚠️ This release's APKs are **debug-signed** — installing alongside a release-signed build is not possible. See [\`docs/release.md\`](${DOCS_RELEASE_URL}) for setting up release signing."
            fi
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Detect prerelease from tag
        id: prerelease
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == *-rc* || "$tag" == *-beta* || "$tag" == *-alpha* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: openvsmobile ${{ github.ref_name }}
          body: ${{ steps.body.outputs.body }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/openvsmobile-backend-*.tar.gz
            artifacts/openvsmobile-backend-*.tar.gz.sha256
            artifacts/install.sh
            artifacts/*.apk
            artifacts/*.apk.sha256
